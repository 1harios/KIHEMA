<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Знак КИНЕМА: кадр и световой луч проектора, проходящий сквозь него.
    Монохром — тот же холст и та же платина, что в интерфейсе.
  -->
  <defs>
    <clipPath id="frame">
      <rect x="4" y="4" width="24" height="24" rx="8" />
    </clipPath>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#dde3ed" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="#08090b" />

  <g clip-path="url(#frame)">
    <path d="M -2 20 L 14 -2 L 24 -2 L 8 20 Z" fill="url(#beam)" opacity="0.55" />
    <path d="M 6 30 L 22 8 L 27 8 L 11 30 Z" fill="#dde3ed" opacity="0.16" />
  </g>

  <rect
    x="5.1"
    y="5.1"
    width="21.8"
    height="21.8"
    rx="6.9"
    fill="none"
    stroke="#dde3ed"
    stroke-width="2.2"
  />
</svg>
